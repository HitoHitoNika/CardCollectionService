spring:
  application:
    name: CardCollectionService
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mydatabase}
    username: ${DB_USER:myuser}
    password: ${DB_PASSWORD:mypassword}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true



logging:
  level:
    root: INFO


server:
  servlet:
    context-path: /api

app:
  imports:
    ygo:
      enabled: true
      address: https://db.ygoprodeck.com/api/v7/cardinfo.php
    op:
      enabled: true
      address: https://optcgapi.com/api/
    magic:
      enabled: true
      address: https://google.com

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health